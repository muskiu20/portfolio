<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <pattern id="dotgrid2" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#171613" opacity="0.05" />
    </pattern>
  </defs>

  <rect width="600" height="400" fill="#DEDCD3" />
  <rect width="600" height="400" fill="url(#dotgrid2)" />

  <!-- envelope -->
  <g>
    <!-- back/body -->
    <rect x="150" y="140" width="300" height="160" rx="6" fill="#F6F3EC" stroke="#171613" stroke-opacity="0.12" stroke-width="1.5" />
    <!-- bottom fold seams -->
    <path d="M150 300 L300 215 L450 300" fill="none" stroke="#171613" stroke-opacity="0.1" stroke-width="1.5" />
    <!-- flap -->
    <path d="M150 140 L450 140 L300 215 Z" fill="#EADFD3" stroke="#171613" stroke-opacity="0.12" stroke-width="1.5" stroke-linejoin="round" />
    <!-- wax seal -->
    <circle cx="300" cy="215" r="25" fill="#C33F27" />
    <path d="M300 226 C 288 216, 284 208, 291 202 C 296 198, 300 201, 300 206 C 300 201, 304 198, 309 202 C 316 208, 312 216, 300 226 Z" fill="#FAF4EF" />
  </g>

  <!-- title -->
  <text x="300" y="352" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-style="italic" font-size="34" text-anchor="middle" fill="#171613">You Are Invited</text>

  <!-- caption -->
  <text x="300" y="380" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" letter-spacing="3" text-anchor="middle" fill="#171613" fill-opacity="0.45">WEDDING INVITE</text>
</svg>
