<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <pattern id="dotgrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#171613" opacity="0.05" />
    </pattern>
  </defs>

  <rect width="600" height="400" fill="#DEDCD3" />
  <rect width="600" height="400" fill="url(#dotgrid)" />

  <!-- Row 1: GUESS — cream tiles, ink letters -->
  <g font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-weight="700" font-size="40" text-anchor="middle">
    <g transform="rotate(-5 132 106)">
      <rect x="96" y="70" width="72" height="72" rx="10" fill="#F6F3EC" stroke="#171613" stroke-opacity="0.12" stroke-width="1.5" />
      <text x="132" y="120" fill="#171613">G</text>
    </g>
    <g transform="rotate(3 216 106)">
      <rect x="180" y="70" width="72" height="72" rx="10" fill="#F6F3EC" stroke="#171613" stroke-opacity="0.12" stroke-width="1.5" />
      <text x="216" y="120" fill="#171613">U</text>
    </g>
    <g transform="rotate(-2 300 106)">
      <rect x="264" y="70" width="72" height="72" rx="10" fill="#F6F3EC" stroke="#171613" stroke-opacity="0.12" stroke-width="1.5" />
      <text x="300" y="120" fill="#171613">E</text>
    </g>
    <g transform="rotate(4 384 106)">
      <rect x="348" y="70" width="72" height="72" rx="10" fill="#F6F3EC" stroke="#171613" stroke-opacity="0.12" stroke-width="1.5" />
      <text x="384" y="120" fill="#171613">S</text>
    </g>
    <g transform="rotate(-3 468 106)">
      <rect x="432" y="70" width="72" height="72" rx="10" fill="#F6F3EC" stroke="#171613" stroke-opacity="0.12" stroke-width="1.5" />
      <text x="468" y="120" fill="#171613">S</text>
    </g>
  </g>

  <!-- connector: downward arrow + "the" -->
  <g>
    <line x1="300" y1="150" x2="300" y2="214" stroke="#C33F27" stroke-width="2.5" stroke-linecap="round" />
    <path d="M288 204 L300 220 L312 204" fill="none" stroke="#C33F27" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="332" y="188" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-style="italic" font-size="22" fill="#4A4841">the</text>
  </g>

  <!-- Row 2: WORD — accent tiles, cream letters -->
  <g font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-weight="700" font-size="40" text-anchor="middle">
    <g transform="rotate(2 174 266)">
      <rect x="138" y="230" width="72" height="72" rx="10" fill="#C33F27" />
      <text x="174" y="280" fill="#FAF4EF">W</text>
    </g>
    <g transform="rotate(-3 258 266)">
      <rect x="222" y="230" width="72" height="72" rx="10" fill="#C33F27" />
      <text x="258" y="280" fill="#FAF4EF">O</text>
    </g>
    <g transform="rotate(3 342 266)">
      <rect x="306" y="230" width="72" height="72" rx="10" fill="#C33F27" />
      <text x="342" y="280" fill="#FAF4EF">R</text>
    </g>
    <g transform="rotate(-2 426 266)">
      <rect x="390" y="230" width="72" height="72" rx="10" fill="#C33F27" />
      <text x="426" y="280" fill="#FAF4EF">D</text>
    </g>
  </g>

  <!-- caption -->
  <text x="300" y="358" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" letter-spacing="3" text-anchor="middle" fill="#171613" fill-opacity="0.45">GUESS THE WORD</text>
</svg>
